name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Python syntax check (exporter)
        run: |
          if [ ! -d exporter ]; then
            echo "exporter/ does not exist; skipping Python syntax check"
            exit 0
          fi
          shopt -s nullglob
          files=(exporter/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No exporter/*.py files; skipping Python syntax check"
            exit 0
          fi
          python3 -m py_compile "${files[@]}"
          echo "Checked ${#files[@]} Python file(s)"
